<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="logoBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="logoRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Container -->
  <rect x="8" y="12" width="72" height="72" rx="18" fill="url(#logoBgGrad)" stroke="#1e293b" stroke-width="2"/>
  <circle cx="44" cy="48" r="28" fill="none" stroke="url(#logoRingGrad)" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="44" cy="20" r="2.5" fill="#22d3ee" filter="url(#logoGlow)"/>
  <circle cx="72" cy="48" r="2.5" fill="#10b981" filter="url(#logoGlow)"/>

  <!-- Lightning Bolt -->
  <path d="M 49 24 L 30 50 L 44 50 L 36 74 L 59 45 L 45 45 Z"
        fill="url(#logoBoltGrad)"
        stroke="#e0f2fe"
        stroke-width="1"
        filter="url(#logoGlow)"/>

  <!-- Brand Typography -->
  <text x="96" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="32" letter-spacing="-0.5">SLOT<tspan fill="#22d3ee">SYNC</tspan></text>
  <text x="98" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="2">CONCURRENCY ENGINE</text>
</svg>
