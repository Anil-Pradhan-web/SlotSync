<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Concentric Orbital Sync Rings -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="64" cy="64" r="36" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="14 8" opacity="0.4"/>

  <!-- Orbital Data Nodes -->
  <circle cx="64" cy="18" r="3.5" fill="#22d3ee" filter="url(#neonGlow)"/>
  <circle cx="110" cy="64" r="3.5" fill="#10b981" filter="url(#neonGlow)"/>
  <circle cx="28" cy="94" r="3.5" fill="#a855f7" filter="url(#neonGlow)"/>

  <!-- Railway Track Geometry (Lower Left) -->
  <path d="M 22 108 L 52 74" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 34 116 L 62 82" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Track Ties -->
  <line x1="24" y1="104" x2="32" y2="114" stroke="#475569" stroke-width="2"/>
  <line x1="33" y1="93" x2="42" y2="103" stroke="#475569" stroke-width="2"/>
  <line x1="43" y1="83" x2="52" y2="92" stroke="#475569" stroke-width="2"/>

  <!-- Stylized Concurrency Lightning Bolt -->
  <path d="M 72 24 L 42 66 L 64 66 L 52 104 L 88 58 L 66 58 Z"
        fill="url(#boltGrad)"
        stroke="#e0f2fe"
        stroke-width="1.5"
        filter="url(#neonGlow)"/>
</svg>