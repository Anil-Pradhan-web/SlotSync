name: SlotSync CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-verification:
    name: Java 23 Microservices & Stress Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'

      - name: Compile DSA Engine & Microservices
        run: |
          mkdir -p bin
          javac -d bin $(find backend -name "*.java")

      - name: Execute 100k Concurrency Stress Test Benchmark
        run: |
          java -cp bin com.slotsync.dsa.stress.TatkalConcurrencyStressTest
